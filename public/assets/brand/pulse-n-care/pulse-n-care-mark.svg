<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pnc-teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7E80" />
      <stop offset="50%" stop-color="#0EA5A4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="pnc-soft-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFBF1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0D7E80" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Care Shield / Heart Circle Background -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="url(#pnc-soft-bg)" stroke="#99F6E4" stroke-width="1.5" />

  <!-- Heartbeat Waveform + Care Arch Symbol -->
  <g filter="url(#shadow)">
    <!-- Heart Outline Arch -->
    <path d="M 50,78 C 30,62 18,48 18,34 C 18,22 28,15 39,17 C 45,18 48,22 50,25 C 52,22 55,18 61,17 C 72,15 82,22 82,34 C 82,48 70,62 50,78 Z" 
          fill="none" 
          stroke="url(#pnc-teal-grad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Pulse ECG Waveform Line crossing through heart center -->
    <path d="M 12,46 L 28,46 L 34,36 L 42,62 L 52,24 L 60,52 L 66,42 L 72,46 L 88,46" 
          fill="none" 
          stroke="url(#pnc-teal-grad)" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Pulse Peak Dot -->
    <circle cx="52" cy="24" r="3.5" fill="#2563EB" />
  </g>
</svg>
