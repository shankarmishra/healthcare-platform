<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <linearGradient id="pnc-teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7E80" />
      <stop offset="50%" stop-color="#0EA5A4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="pnc-soft-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFBF1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0D7E80" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Mark Container -->
  <g transform="translate(5, 5)">
    <rect x="0" y="0" width="80" height="80" rx="24" fill="url(#pnc-soft-bg)" stroke="#99F6E4" stroke-width="1.5" />
    
    <g filter="url(#shadow)">
      <!-- Heart Outline -->
      <path d="M 40,66 C 24,52 14,40 14,28 C 14,18 22,12 31,14 C 36,15 38,18 40,21 C 42,18 44,15 49,14 C 58,12 66,18 66,28 C 66,40 56,52 40,66 Z" 
            fill="none" 
            stroke="url(#pnc-teal-grad)" 
            stroke-width="4" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Pulse ECG Waveform Line -->
      <path d="M 8,38 L 22,38 L 27,30 L 33,52 L 41,20 L 48,44 L 53,35 L 58,38 L 72,38" 
            fill="none" 
            stroke="url(#pnc-teal-grad)" 
            stroke-width="3.5" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <circle cx="41" cy="20" r="3" fill="#2563EB" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(100, 22)" text-anchor="start">
    <!-- Brand Title: Pulse n Care -->
    <text x="0" y="28" font-family="Manrope, system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" letter-spacing="-0.5">
      <tspan fill="#0F172A">Pulse</tspan>
      <tspan fill="#0EA5A4" font-weight="700"> n </tspan>
      <tspan fill="#0D7E80">Care</tspan>
    </text>

    <!-- Tagline: Nurse care at doorstep -->
    <text x="0" y="48" font-family="Manrope, system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#2563EB" letter-spacing="0.6">
      NURSE CARE AT DOORSTEP
    </text>
  </g>
</svg>
